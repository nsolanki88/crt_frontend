<!DOCTYPE html>
<html>
<head>
    <title>Chess Board</title>

    <link rel="stylesheet" href="brd.css">
</head>

<body>

    <div class="chessboard">

        <!-- Row 1 -->
        <div class="square black">♜</div>
        <div class="square white">♞</div>
        <div class="square black">♝</div>
        <div class="square white">♛</div>
        <div class="square black">♚</div>
        <div class="square white">♝</div>
        <div class="square black">♞</div>
        <div class="square white">♜</div>

        <!-- Row 2 -->
        <div class="square white">♟</div>
        <div class="square black">♟</div>
        <div class="square white">♟</div>
        <div class="square black">♟</div>
        <div class="square white">♟</div>
        <div class="square black">♟</div>
        <div class="square white">♟</div>
        <div class="square black">♟</div>

        <!-- Row 3 -->
        <div class="square black"></div>
        <div class="square white"></div>
        <div class="square black"></div>
        <div class="square white"></div>
        <div class="square black"></div>
        <div class="square white"></div>
        <div class="square black"></div>
        <div class="square white"></div>

        <!-- Row 4 -->
        <div class="square white"></div>
        <div class="square black"></div>
        <div class="square white"></div>
        <div class="square black"></div>
        <div class="square white"></div>
        <div class="square black"></div>
        <div class="square white"></div>
        <div class="square black"></div>

        <!-- Row 5 -->
        <div class="square black"></div>
        <div class="square white"></div>
        <div class="square black"></div>
        <div class="square white"></div>
        <div class="square black"></div>
        <div class="square white"></div>
        <div class="square black"></div>
        <div class="square white"></div>

        <!-- Row 6 -->
        <div class="square white"></div>
        <div class="square black"></div>
        <div class="square white"></div>
        <div class="square black"></div>
        <div class="square white"></div>
        <div class="square black"></div>
        <div class="square white"></div>
        <div class="square black"></div>

        <!-- Row 7 -->
        <div class="square black">♙</div>
        <div class="square white">♙</div>
        <div class="square black">♙</div>
        <div class="square white">♙</div>
        <div class="square black">♙</div>
        <div class="square white">♙</div>
        <div class="square black">♙</div>
        <div class="square white">♙</div>

        <!-- Row 8 -->
        <div class="square white">♖</div>
        <div class="square black">♘</div>
        <div class="square white">♗</div>
        <div class="square black">♕</div>
        <div class="square white">♔</div>
        <div class="square black">♗</div>
        <div class="square white">♘</div>
        <div class="square black">♖</div>

    </div>

</body>
</html>
